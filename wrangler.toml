name = "pool-diving-scorer"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"

[[durable_objects.bindings]]
name = "MEET"
class_name = "Meet"

[[durable_objects.bindings]]
name = "COMPETITION"
class_name = "Competition"

# SQLite-backed Durable Objects are available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Meet"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Competition"]

# Per-visitor limits (Workers Rate Limiting): creating meets/competitions, and
# looking codes up. They stop one visitor using up the plan's daily requests.
[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "LOOKUP_LIMIT"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 120
  period = 60

[observability]
enabled = true
