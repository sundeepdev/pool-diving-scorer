<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#061a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Judge Pad</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body class="judge">
<div id="join" class="wrap hidden" style="max-width:480px;padding-top:32px">
  <a class="brand" href="/"><img src="/icon.svg" alt="" width="26" height="26"> Pool Diving Scorer</a>
  <section class="card" style="margin-top:20px">
    <h2>Judge sign-in</h2>
    <p class="lead" id="joinMeetName">Enter the meet code and the PIN from the referee.</p>
    <form id="joinForm">
      <div class="field"><label for="joinCode">Meet code</label><input id="joinCode" class="mono" maxlength="6" autocapitalize="characters" autocomplete="off" required></div>
      <div class="field"><label>Your judge seat</label><div id="seats" class="row" style="gap:8px"></div></div>
      <div class="field"><label for="joinPin">Judge PIN</label><input id="joinPin" class="mono" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" required></div>
      <button class="btn primary" style="width:100%;min-height:56px;font-size:18px">Start judging</button>
      <p class="error" id="joinErr"></p>
    </form>
  </section>
</div>

<div id="pad" class="pad-app hidden">
  <header class="topbar">
    <span class="pill" id="seatPill">J–</span>
    <span class="title" id="meetName"></span>
    <span class="pill"><span class="dot" id="connDot"></span><span id="connText">…</span></span>
    <button class="btn small" id="themeBtn" title="Toggle high-contrast light mode" aria-label="Toggle light mode">☀︎</button>
    <button class="btn small" id="leaveBtn">Leave</button>
  </header>
  <div class="banner bad hidden" id="offlineBanner">Connection lost — reconnecting. Scores you send will be delivered when back online.</div>
  <main class="pad-main">
    <section class="dive-card" id="diveCard"></section>
    <section class="readout" id="readout" aria-live="polite">
      <div class="value" id="readValue">–</div>
      <div class="status" id="readStatus"></div>
    </section>
    <section class="keypad hidden" id="keypad" aria-label="Score keypad"></section>
    <section class="pad-wait" id="padWait"><div><h2>Connecting…</h2><p>Loading the current dive.</p></div></section>
    <button class="send" id="sendBtn" disabled>WAITING</button>
  </main>
</div>
<div class="toast hidden" id="toast" role="alert"></div>
<script type="module" src="/judge.js"></script>
</body>
</html>
